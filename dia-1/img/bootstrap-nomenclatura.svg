<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
  <title>Cómo se leen las clases de Bootstrap</title>
  <style>
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Arial, sans-serif; }
    .h { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #9aa1ad; letter-spacing: 1.5px; }
    .box { fill: #1f2029; }
    .y { fill: #f5d042; }
    .t { fill: #e6e8ec; }
    .m { fill: #9aa1ad; }
  </style>
  <rect width="960" height="720" fill="#0b0d14"/>

  <text x="30" y="52" class="sans t" font-size="28" font-weight="700">Cómo se leen las clases de Bootstrap</text>

  <!-- Fórmula -->
  <rect class="box" x="30" y="76" width="900" height="150" rx="14"/>
  <text x="54" y="104" class="h">UTILIDADES: UNA SOLA PROPIEDAD CSS</text>
  <text x="54" y="160" class="mono y" font-size="44" font-weight="700">p<tspan fill="#8fbbe3">y</tspan><tspan fill="#9aa1ad">-</tspan><tspan fill="#e07a3f">3</tspan></text>
  <text x="54" y="200" class="mono m" font-size="16">propiedad · lado · tamaño</text>
  <text x="340" y="138" class="sans t" font-size="17"><tspan class="y" font-weight="700">p</tspan>  = padding (relleno interior)   ·   <tspan class="y" font-weight="700">m</tspan>  = margin (espacio exterior)</text>
  <text x="340" y="168" class="sans t" font-size="17"><tspan fill="#8fbbe3" font-weight="700">y</tspan>  = arriba y abajo (eje vertical)</text>
  <text x="340" y="198" class="sans t" font-size="17"><tspan fill="#e07a3f" font-weight="700">3</tspan>  = tamaño, de 0 (nada) a 5 (el más grande)</text>

  <!-- Lados -->
  <rect class="box" x="30" y="240" width="440" height="200" rx="14"/>
  <text x="54" y="268" class="h">LADOS</text>
  <g class="sans t" font-size="17">
    <text x="54" y="302"><tspan class="mono" fill="#8fbbe3" font-weight="700">t</tspan>   arriba (top)</text>
    <text x="54" y="332"><tspan class="mono" fill="#8fbbe3" font-weight="700">b</tspan>   abajo (bottom)</text>
    <text x="54" y="362"><tspan class="mono" fill="#8fbbe3" font-weight="700">s</tspan>   inicio (start)</text>
    <text x="250" y="302"><tspan class="mono" fill="#8fbbe3" font-weight="700">e</tspan>   final (end)</text>
    <text x="250" y="332"><tspan class="mono" fill="#8fbbe3" font-weight="700">x</tspan>   izquierda y derecha</text>
    <text x="250" y="362"><tspan class="mono" fill="#8fbbe3" font-weight="700">y</tspan>   arriba y abajo</text>
  </g>
  <text x="54" y="410" class="mono m" font-size="16">mt-2   px-0   py-4   mb-3</text>

  <!-- Breakpoints -->
  <rect class="box" x="490" y="240" width="440" height="200" rx="14"/>
  <text x="514" y="268" class="h">TAMAÑOS DE PANTALLA</text>
  <g class="sans t" font-size="17">
    <text x="514" y="302"><tspan class="mono y" font-weight="700">sm</tspan>    desde 576 px</text>
    <text x="514" y="332"><tspan class="mono y" font-weight="700">md</tspan>    desde 768 px</text>
    <text x="514" y="362"><tspan class="mono y" font-weight="700">lg</tspan>    desde 992 px</text>
    <text x="714" y="302"><tspan class="mono y" font-weight="700">xl</tspan>    desde 1200 px</text>
    <text x="714" y="332"><tspan class="mono y" font-weight="700">xxl</tspan>   desde 1400 px</text>
  </g>
  <text x="514" y="410" class="mono m" font-size="16">col-md-6 = media fila desde 768 px</text>

  <!-- Colores -->
  <rect class="box" x="30" y="454" width="900" height="120" rx="14"/>
  <text x="54" y="482" class="h">COLORES DEL TEMA · se combinan con bg-  text-  btn-  border-</text>
  <g class="sans" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="54" y="500" width="100" height="40" rx="8" fill="#0d6efd"/><text x="104" y="525" fill="#ffffff">primary</text>
    <rect x="164" y="500" width="100" height="40" rx="8" fill="#6c757d"/><text x="214" y="525" fill="#ffffff">secondary</text>
    <rect x="274" y="500" width="100" height="40" rx="8" fill="#198754"/><text x="324" y="525" fill="#ffffff">success</text>
    <rect x="384" y="500" width="100" height="40" rx="8" fill="#dc3545"/><text x="434" y="525" fill="#ffffff">danger</text>
    <rect x="494" y="500" width="100" height="40" rx="8" fill="#ffc107"/><text x="544" y="525" fill="#000000">warning</text>
    <rect x="604" y="500" width="100" height="40" rx="8" fill="#0dcaf0"/><text x="654" y="525" fill="#000000">info</text>
    <rect x="714" y="500" width="100" height="40" rx="8" fill="#f8f9fa"/><text x="764" y="525" fill="#000000">light</text>
    <rect x="824" y="500" width="90" height="40" rx="8" fill="#212529" stroke="#6b7080"/><text x="869" y="525" fill="#ffffff">dark</text>
  </g>
  <text x="54" y="562" class="mono m" font-size="16">bg-dark   text-white   btn-primary   border-danger</text>

  <!-- Componentes -->
  <rect class="box" x="30" y="588" width="900" height="104" rx="14"/>
  <text x="54" y="616" class="h">COMPONENTES: CLASE BASE + MODIFICADORES</text>
  <text x="54" y="656" class="mono" font-size="24" font-weight="700"><tspan class="y">btn</tspan> <tspan fill="#8fbbe3">btn-primary</tspan> <tspan fill="#e07a3f">btn-sm</tspan></text>
  <text x="430" y="652" class="sans t" font-size="17"><tspan class="y" font-weight="700">base</tspan> (qué es)  +  <tspan fill="#8fbbe3" font-weight="700">color</tspan>  +  <tspan fill="#e07a3f" font-weight="700">tamaño</tspan></text>
  <text x="54" y="680" class="mono m" font-size="15">navbar navbar-expand   ·   table table-striped   ·   form-control</text>
</svg>
